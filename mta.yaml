_schema-version: "3.2"
ID: helloworldsaas
description: Hello World as a multitenant SaaS application (Practical work 3)
version: 0.0.1
modules:
# App router ###########################################################
- name: helloworldsaas-approuter
  type: approuter.nodejs
  path: helloworldsaas-approuter
  requires:
  - name: helloworldsaas-html5-repo-runtime
  - name: helloworldsaas-uaa
  - name: helloworldsaas-destination-service
    group: destinations
    properties:
      forwardAuthToken: true
      name: ui5
      url: https://ui5.sap.com
  - name: helloworldsaas-saas-registry
  parameters:
    routes:
      - route: https://${subdomain}-${appname}.${default-domain}
      - route: https://${customer_subdomain}-${appname}.${default-domain}
    disk-quota: 256M
    memory: 256M
  properties:
    TENANT_HOST_PATTERN: "^(.*)-${appname}.${default-domain}"
    CJ_PROTECT_WHITELIST: '[{"protocol": "https","host":"*.ondemand.com"}]'
    httpHeaders: '[{"Content-Security-Policy":"frame-ancestors https://*.ondemand.com;"},{"X-Frame-Options":"SAMEORIGIN"},{"Cache-control":"no-cache, no-store, must-revalidate"}]'
########################################################################

# Destination deployer module - create CDM DT destination ##############
- name: helloworldsaas-destination-content
  type: com.sap.application.content
  requires:
  - name: helloworldsaas-destination-service
    parameters:
      content-target: true
  - name: helloworldsaas-html5-repo-runtime
    parameters:
      service-key:
        name: helloworldsaas-app-rt-key
  - name: helloworldsaas-uaa
    parameters:
      service-key:
        name: helloworldsaas-uaa-key
  parameters:
    content:
      subaccount:
        destinations:
        - Name: provider_cdm
          ServiceInstanceName: helloworldsaas-app-rt-service
          ServiceKeyName: helloworldsaas-app-rt-key
          URL: https://html5-apps-repo-rt.cfapps.us10.hana.ondemand.com/applications/cdm/kpi_helloworld
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
########################################################################

# HTML5 app deployer module - store xsuaa, backend destinations ########
- name: helloworldsaas-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: helloworldsaas-uaa
  - name: helloworldsaas-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - sapbtphelloworldui5.zip
      name: sapbtphelloworldui5
      target-path: resources/
  parameters:
    config:
      destinations:
      - name: ui5
        url: https://ui5.sap.com
########################################################################

# HTML5 Module #########################################################
- name: sapbtphelloworldui5
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
########################################################################

resources:
# XSUAA (shared tenant mode for SaaS) ##################################
- name: helloworldsaas-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: shared
      xsappname: ${appname}
      oauth2-configuration:
        redirect-uris:
          - https://*.cfapps.us10-001.hana.ondemand.com/**
      scopes:
        - name: $XSAPPNAME.Callback
          description: With this scope set, the callbacks for tenant onboarding, offboarding and getDependencies can be called.
          grant-as-authority-to-apps:
            - $XSAPPNAME(application,sap-provisioning,tenant-onboarding)
      foreign-scope-references:
        - uaa.user
    service: xsuaa
    service-name: helloworldsaas-xsuaa-service
    service-plan: application
########################################################################

# HTML5 app-runtime resource for CDM DT destination ####################
- name: helloworldsaas-html5-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: helloworldsaas-app-rt-service
    service-plan: app-runtime
########################################################################

# HTML5 app-host resource - upload html5 apps ##########################
- name: helloworldsaas-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: helloworldsaas-html5-service
    service-plan: app-host
########################################################################

# Destination resource for CDM RT destination ##########################
- name: helloworldsaas-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        subaccount:
          destinations:
          - Authentication: NoAuthentication
            Name: provider-rt
            ProxyType: Internet
            Type: HTTP
            CEP.HTML5contentprovider: true
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            URL: https://${customer_subdomain}.launchpad.cfapps.us10.hana.ondemand.com/
          existing_destinations_policy: ignore
      version: 1.0.0
    service: destination
    service-name: helloworldsaas-destination-service
    service-plan: lite
########################################################################

# SaaS Provisioning (makes the app subscribable from other subaccounts)
- name: helloworldsaas-saas-registry
  type: org.cloudfoundry.managed-service
  parameters:
    service: saas-registry
    service-plan: application
    service-name: ${appname}-saas-registry
    config:
      xsappname: ${appname}
      appName: ${appname}
      displayName: Hello World (SaaS)
      description: SaaS Hello World
      category: Custom KPI Apps
      appUrls:
        onSubscription: https://${subdomain}-${appname}.${default-domain}/callback/v1.0/tenants/{tenantId}
        getDependencies: https://${subdomain}-${appname}.${default-domain}/callback/v1.0/dependencies
########################################################################

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
  appname: helloworldsaas
  subdomain: fd508f00trial
  customer_subdomain: consumer1-fd508f00

build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm install
    - mkdir -p resources
    - cp workzone/cdm.json resources/cdm.json
